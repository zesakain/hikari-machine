name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build-and-test:
    name: Linux GCC (Debug & ASan)
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build \
            clang-format \
            clang-tidy

      - name: Verify code formatting
        run: |
          find . -name '*.cpp' -o -name '*.h' | grep -v '^./build' | xargs clang-format --dry-run --Werror

      - name: Configure Debug preset
        run: cmake --preset debug

      - name: Build Debug preset
        run: cmake --build --preset debug

      - name: Run CTest Debug preset
        run: ctest --preset debug --output-on-failure

      - name: Configure ASan/UBSan preset
        run: cmake --preset asan

      - name: Build ASan/UBSan preset
        run: cmake --build --preset asan

      - name: Run CTest ASan/UBSan preset
        run: ctest --preset asan --output-on-failure
