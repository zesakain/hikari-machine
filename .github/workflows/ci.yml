name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  format-and-lint:
    name: Code Formatting & Static Analysis
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Linting Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang-format \
            clang-tidy

      - name: Verify Code Formatting (clang-format)
        run: |
          find engine editor src tests -name '*.cpp' -o -name '*.h' | grep -v 'engine/script/src/lua' | grep -v 'engine/world/src/flecs' | xargs clang-format --dry-run --Werror

  build-and-test:
    name: Build & Test (${{ matrix.preset }})
    needs: format-and-lint
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        preset: [debug, release, profile, editor, asan, tsan]

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Engine Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build \
            libvulkan-dev \
            mesa-vulkan-drivers \
            libfreetype6-dev \
            libasound2-dev \
            libpulse-dev \
            libx11-dev \
            libxrandr-dev \
            libxcursor-dev \
            libxi-dev \
            libxinerama-dev \
            libxkbcommon-dev \
            libwayland-dev \
            wayland-protocols

      - name: Cache SDL3
        id: cache-sdl3
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/sdl3-install
          key: sdl3-3.2.8-ubuntu-24.04-x86_64

      - name: Build and Install SDL3
        if: steps.cache-sdl3.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch release-3.2.8 https://github.com/libsdl-org/SDL.git /tmp/sdl3-src
          cmake -S /tmp/sdl3-src -B /tmp/sdl3-src/build -GNinja \
            -DCMAKE_BUILD_TYPE=Release \
            -DSDL_SHARED=ON \
            -DSDL_STATIC=OFF \
            -DSDL_TESTS=OFF \
            -DSDL_EXAMPLES=OFF \
            -DCMAKE_INSTALL_PREFIX=${{ runner.temp }}/sdl3-install
          cmake --build /tmp/sdl3-src/build --target install
          rm -rf /tmp/sdl3-src

      - name: Deploy SDL3 to System
        run: |
          sudo cp -r ${{ runner.temp }}/sdl3-install/* /usr/local/
          sudo ldconfig

      - name: Configure Preset (${{ matrix.preset }})
        run: cmake --preset ${{ matrix.preset }}

      - name: Compile Preset (${{ matrix.preset }})
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Run Test Suite (${{ matrix.preset }})
        run: ctest --preset ${{ matrix.preset }} --output-on-failure

      - name: Execute Headless Engine Verification
        if: matrix.preset == 'debug' || matrix.preset == 'release'
        run: ./build/${{ matrix.preset }}/bin/hikari --headless --frames 60

      - name: Package Release Binary (CPack)
        if: matrix.preset == 'release'
        run: |
          cd build/release
          cpack -G TGZ

      - name: Upload Binary Package Artifact
        if: matrix.preset == 'release'
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: hikari-linux-x86_64-release
          path: build/release/*.tar.gz
          retention-days: 7
